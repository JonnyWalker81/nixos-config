# greenclip v4.1 clipboard-history config (browsed via rofi on Alt+r and Super+Ctrl+V).
# greenclip reads ~/.config/greenclip.toml by default and requires the full schema
# below (a partial config is rejected). Validated against greenclip v4.1.
[greenclip]
  history_file = "/home/cipher/.cache/greenclip.history"
  max_history_length = 200
  max_selection_size_bytes = 0
  use_primary_selection_as_input = false
  trim_space_from_selection = true
  static_history = []
  image_cache_directory = "/tmp/greenclip"
  blacklisted_applications = []
  enable_image_support = true
