; Omarchy-style polybar — single Tokyo Night top bar for DWM/X11.
; DWM reserves `altbarpx` px at the top (config.h) so tiled windows don't overlap
; this bar; keep [bar/main] height in sync with altbarpx (currently 36).

[colors]
bg      = #1a1b26
bg-alt  = #24283b
bg-sel  = #2e3440
dim     = #3e4554
fg      = #a9b1d6
blue    = #7aa2f7
cyan    = #b4f9f8
red     = #f7768e
orange  = #ff9e64
green   = #9ece6a
purple  = #bb9af7
yellow  = #e0af68

[bar/main]
width = 100%
height = 36
; DWM does not manage docks, so run as override-redirect to avoid being tiled;
; the space is reserved by DWM's altbarpx instead of by struts.
override-redirect = true
bottom = false
fixed-center = true

background = ${colors.bg}
foreground = ${colors.fg}

line-size = 2
padding-left = 1
padding-right = 1
module-margin = 1
separator = %{F#3e4554}·%{F-}

font-0 = JetBrainsMono Nerd Font:pixelsize=13;2
font-1 = JetBrainsMono Nerd Font:style=Bold:pixelsize=13;2
font-2 = JetBrainsMono Nerd Font:pixelsize=15;3

modules-left = omarchy xworkspaces
modules-center = clock weather
modules-right = pulseaudio network cpu memory filesystem

cursor-click = pointer
enable-ipc = true

tray-position = right
tray-maxsize = 22
tray-background = ${colors.bg}
tray-padding = 2

[module/omarchy]
type = custom/text
content = "  󰣇  "
content-foreground = ${colors.purple}
content-font = 3
; left-click opens the Omarchy command menu (same as Alt+c)
click-left = omarchy-menu &

[module/xworkspaces]
type = internal/xworkspaces
pin-workspaces = true
enable-click = true
enable-scroll = true
; workspaces come from DWM's EWMH desktops (_NET_CURRENT_DESKTOP etc.)
label-active = %index%
label-active-foreground = ${colors.cyan}
label-active-background = ${colors.bg-sel}
label-active-padding = 2
label-occupied = %index%
label-occupied-foreground = ${colors.fg}
label-occupied-padding = 2
label-empty = %index%
label-empty-foreground = ${colors.dim}
label-empty-padding = 2

[module/clock]
type = internal/date
interval = 30
date = "%a %b %d   %H:%M"
date-alt = "%Y-%m-%d  week %V"
label = "  %date%"
label-foreground = ${colors.fg}

[module/weather]
type = custom/script
exec = /home/cipher/scripts/wttr.sh
interval = 900
label = "  %output%"
label-foreground = ${colors.cyan}

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%
label-muted = "󰝟 muted"
label-muted-foreground = ${colors.dim}
ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
ramp-volume-foreground = ${colors.orange}

[module/network]
type = internal/network
interface-type = wired
interval = 5
format-connected = <label-connected>
label-connected = "󰈁 %ifname%"
label-connected-foreground = ${colors.blue}
format-disconnected = <label-disconnected>
label-disconnected = "󰈂 down"
label-disconnected-foreground = ${colors.dim}

[module/cpu]
type = internal/cpu
interval = 2
label = " %percentage%%"
label-foreground = ${colors.green}

[module/memory]
type = internal/memory
interval = 3
label = " %percentage_used%%"
label-foreground = ${colors.purple}

[module/filesystem]
type = internal/fs
mount-0 = /
interval = 30
label-mounted = " %free%"
label-mounted-foreground = ${colors.yellow}
label-unmounted =

[settings]
screenchange-reload = true
pseudo-transparency = false
